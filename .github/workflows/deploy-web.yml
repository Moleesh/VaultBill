# @format

name: Deploy Web

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: VaultBill
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web
        run: npm run build:web
