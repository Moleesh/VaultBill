name: Release App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Dependency audit
        run: npm run audit:security

      - name: Secret scan
        run: npm run scan:secrets

      - name: Security tests
        run: npm run test:security

      - name: Security configuration
        run: npm run security:check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser flows
        run: npm run test:e2e

      - name: Build web
        run: npm run build:web

      - name: Rebuild Electron native modules
        run: npm run rebuild:native

      - name: Build desktop shell
        run: npm run build:desktop

      - name: Package desktop directory
        run: npm run package:desktop

      - name: Installer smoke test
        run: npm run smoke:installer

  package:
    runs-on: windows-latest
    needs: verify
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web
        run: npm run build:web

      - name: Rebuild Electron native modules
        run: npm run rebuild:native

      - name: Build Electron shell
        run: npm run build:electron

      - name: Package desktop installer
        run: npm run package:desktop:installer

      - name: Installer smoke test
        run: npm run smoke:installer:required

      - name: First-run DB startup patch smoke
        run: npm run smoke:first-run-db:ci

      - name: Generate release notes
        run: npm run release:notes

      - name: Generate SHA-256 checksums
        run: npm run release:checksums

      - name: Record signing status
        shell: pwsh
        run: |
          if ($env:CSC_LINK) {
            "Signing credentials configured." | Add-Content artifacts\release-notes.md
          } else {
            "Unsigned/internal Windows build. Not a public production release." | Add-Content artifacts\release-notes.md
          }

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vaultbill-desktop-release
          path: |
            release/**
            artifacts/release-notes.md

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $releaseTag = "v$($package.version)"
          $releaseTitle = "VaultBill $releaseTag"
          $releaseNotesPath = Join-Path $PWD 'artifacts\release-notes.md'
          $releaseFiles = @(
            Get-ChildItem -Path release -File |
              Sort-Object Name |
              Select-Object -ExpandProperty FullName
          )

          if ($releaseFiles.Count -eq 0) {
            throw 'No release files were found in release/.'
          }

          gh release view $releaseTag *> $null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Deleting existing GitHub release and tag for $releaseTag."
            gh release delete $releaseTag -y --cleanup-tag
          } else {
            Write-Host "No existing GitHub release found for $releaseTag."
          }

          gh release create $releaseTag @releaseFiles --title $releaseTitle --notes-file $releaseNotesPath --target $env:GITHUB_SHA
