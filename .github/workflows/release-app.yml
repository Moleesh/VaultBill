# @format
name: Release App

on:
    push:
        branches: [main]
        tags:
            - 'v*'

permissions:
    contents: read

concurrency:
    group: release-app-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Install
              run: npm ci

            - name: Verify tag matches package version
              if: startsWith(github.ref, 'refs/tags/')
              shell: bash
              run: |
                  package_tag="v$(node -p "require('./package.json').version")"
                  test "${GITHUB_REF_NAME}" = "${package_tag}" || {
                    echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_tag}."
                    exit 1
                  }

            - name: Release verify suite
              run: npm run verify:release

            - name: Upload browser failure evidence
              if: failure()
              uses: actions/upload-artifact@v5
              with:
                  name: playwright-failure-${{ github.run_id }}
                  path: |
                      playwright-report/**
                      test-results/**
                  if-no-files-found: ignore

    package-windows:
        runs-on: windows-latest
        needs: verify
        env:
            VAULTBILL_LICENSE_KEY: ${{ secrets.VAULTBILL_LICENSE_KEY }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Install
              run: npm ci

            - name: Build desktop
              run: npm run build:desktop

            - name: Rebuild Electron native modules
              run: npm run rebuild:native

            - name: Package Windows installer
              run: npx electron-builder --config electron-builder.config.cjs --win nsis --x64 --publish never

            - name: Installer smoke
              run: npm run smoke:installer:required

            - name: Upload Windows artifacts
              uses: actions/upload-artifact@v5
              with:
                  name: vaultbill-windows-${{ github.sha }}
                  path: |
                      release/*.exe
                      release/*.blockmap
                      release/latest*.yml
                  if-no-files-found: error

    package-linux:
        runs-on: ubuntu-latest
        needs: verify
        env:
            VAULTBILL_LICENSE_KEY: ${{ secrets.VAULTBILL_LICENSE_KEY }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Install
              run: npm ci

            - name: Build desktop
              run: npm run build:desktop

            - name: Rebuild Electron native modules
              run: npm run rebuild:native

            - name: Package Linux AppImage
              run: npx electron-builder --config electron-builder.config.cjs --linux AppImage --x64 --publish never

            - name: Package smoke
              run: npm run smoke:installer:required

            - name: Upload Linux artifacts
              uses: actions/upload-artifact@v5
              with:
                  name: vaultbill-linux-${{ github.sha }}
                  path: |
                      release/*.AppImage
                      release/latest*.yml
                  if-no-files-found: error

    package-android:
        runs-on: ubuntu-latest
        needs: verify

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3

            - name: Install
              run: npm ci

            - name: Build Android APK
              run: npm run build:android:ci

            - name: Upload Android artifacts
              uses: actions/upload-artifact@v5
              with:
                  name: vaultbill-android-${{ github.sha }}
                  path: android/app/build/outputs/apk/debug/*.apk
                  if-no-files-found: error

    publish:
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        needs: [package-windows, package-linux, package-android]
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Download release artifacts
              uses: actions/download-artifact@v8
              with:
                  pattern: vaultbill-*-${{ github.sha }}
                  path: release
                  merge-multiple: true

            - name: Generate release notes and checksums
              run: |
                  npm run release:notes
                  npm run release:checksums
                  printf '\n## Signing status\n\n- Windows, Linux, and Android artifacts are unsigned unless signing credentials were configured by the repository owner.\n' >> artifacts/release-notes.md

            - name: Replace same-version release
              shell: bash
              run: |
                  release_tag="v$(node -p "require('./package.json').version")"
                  if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
                    echo "Tag ${GITHUB_REF_NAME} does not match ${release_tag}."
                    exit 1
                  fi
                  if gh release view "${release_tag}" >/dev/null 2>&1; then
                    gh release delete "${release_tag}" --yes --cleanup-tag
                  elif git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
                    git push origin ":refs/tags/${release_tag}"
                  fi
                  mapfile -t release_files < <(find release -maxdepth 1 -type f -print | sort)
                  test "${#release_files[@]}" -gt 0
                  gh release create "${release_tag}" "${release_files[@]}" \
                    --title "VaultBill ${release_tag}" \
                    --notes-file artifacts/release-notes.md \
                    --target "${GITHUB_SHA}"
