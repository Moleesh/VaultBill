# @format

name: Build Release Files

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Coverage check
        run: npm run coverage:ci

      - name: Build web
        run: npm run build:web

      - name: Rebuild Electron native modules
        run: npm run rebuild:native

      - name: Build desktop shell
        run: npm run build:desktop

      - name: Package desktop directory
        run: npm run package:desktop

      - name: Installer smoke test
        run: npm run smoke:installer

  package:
    runs-on: windows-latest
    needs: verify
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web
        run: npm run build:web

      - name: Rebuild Electron native modules
        run: npm run rebuild:native

      - name: Build Electron shell
        run: npm run build:electron

      - name: Package desktop installer
        run: npm run package:desktop:installer

      - name: Installer smoke test
        run: npm run smoke:installer:required

      - name: First-run DB startup patch smoke
        run: npm run smoke:first-run-db:ci

      - name: Generate release notes
        run: npm run release:notes

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vaultbill-desktop-release
          path: |
            release/**
            artifacts/release-notes.md
