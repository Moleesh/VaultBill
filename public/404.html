<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>VaultBill</title>
        <script>
            (function () {
                const basePath = '/VaultBill/';
                const route = window.location.pathname.startsWith('/VaultBill/')
                    ? window.location.pathname.slice('/VaultBill'.length)
                    : '/login';
                window.location.replace(basePath + '?route=' + encodeURIComponent(route));
            })();
        </script>
    </head>
    <body>
        <noscript>
            <p>VaultBill is restoring your requested page.</p>
        </noscript>
    </body>
</html>
